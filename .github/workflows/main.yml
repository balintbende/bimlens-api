name: Api CI/CD

# Controls when the action will run.
on: [push, pull_request]
jobs:
  test:
    name: "Running tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: "Install dotnet format"
        run: dotnet tool update --global dotnet-format

      - name: "Run dotnet format"
        working-directory: ./src
        run: dotnet format --verbosity diagnostic --verify-no-changes

      - name: "Unit tests"
        working-directory: ./src
        run: dotnet test --test-adapter-path:. --logger:"junit;LogFilePath=../artifacts/test-output.xml"

      - name: "Publish Unit Test Results"
        uses: EnricoMi/publish-unit-test-result-action@v1.6
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: ./src/artifacts/*.xml

  publish:
    needs: test
    name: "Build And Publish Image"
    # Only publish on pushes to branches, not on pull requests.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: "Log in to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Extract image metadata"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: "Build and push image to GHCR"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
